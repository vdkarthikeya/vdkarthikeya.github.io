      home:[
        "Java engine generating explorable 2D tile worlds from a seed, deterministic per seed.",
        "Interactive WASD movement plus save/load persistence restoring exact world state."
      ],
      full:[
        "Designed and built a Java engine that generates explorable 2D tile worlds from a seed, using a pseudorandom generator so the same seed always reproduces the exact same world.",
        "Generated distinct rooms and connecting hallways with randomized counts, sizes, and positions drawn onto a tile grid.",
        "Implemented interactive WASD movement and save/load persistence that restores the world \u2014 including the random-number-generator state \u2014 exactly as it was left.",
        "Emphasized large-project architecture, object-oriented design, and deterministic, testable generation."
      ]
    }
  ],
  skills: [
    { group:"Languages", items:["Python","Java","C++","SQL","Scheme"] },
    { group:"Libraries", items:["pandas","NumPy","Matplotlib","seaborn","scikit-learn","XGBoost","LightGBM","SentenceTransformers"] },
    { group:"Tools", items:["Git","GitHub","VS Code","IntelliJ","Jupyter","Google Colab","MATLAB"] }
  ]
};

const ICON = {
  github: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>',
  linkedin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>',
  email: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>'
};

/* ===================== render ===================== */
(function () {
  "use strict";
  var PAGES = ["home","about","experience","projects","courses"], LIMIT = 3;
  function el(id){ return document.getElementById(id); }
  function ul(list){ return "<ul>" + list.map(function(b){ return "<li>"+b+"</li>"; }).join("") + "</ul>"; }
  function expCard(x){
    var loc = x.location ? " \u00b7 " + x.location : "";
    return '<article class="entry"><div class="entry-head"><span class="entry-title">'+x.role+'</span>'+
      '<span class="entry-when">'+x.dates+'</span></div><div class="entry-sub">'+x.company+loc+'</div>'+ul(x.bullets)+'</article>';
  }
  function projCard(p, full){
    var repo = p.repo ? '<a class="repo" href="'+p.repo+'" target="_blank" rel="noopener">View repository \u2192</a>' : "";
    return '<article class="entry"><div class="entry-head"><span class="entry-title">'+p.title+'</span>'+
      '<span class="entry-tag">'+p.tag+'</span></div><div class="entry-sub">'+p.stack+'</div>'+ul(full?p.full:p.home)+repo+'</article>';
  }
  function viewAll(href, label){ return '<a class="view-all" href="'+href+'">'+label+' <span class="arr">\u2192</span></a>'; }

  function renderRail(){
    var c = siteData.contact;
    var now = siteData.current.map(function(x){
      return x.role + " @ " + x.org;
    }).join("<br>");
    el("rail").innerHTML =
      '<div class="avatar"><img src="'+siteData.photo+'" alt="'+siteData.name+'" onerror="this.style.display=\'none\';this.parentNode.classList.add(\'noimg\')"></div>'+
      '<h1>'+siteData.name.replace(/ ([^ ]+)$/,"<br>$1")+'</h1>'+
      '<div class="rail-meta">'+
        '<a href="mailto:'+c.email+'">'+c.email+'</a>'+
        '<a href="'+c.github+'" target="_blank" rel="noopener">'+c.githubLabel+'</a>'+
        '<a href="'+c.linkedin+'">'+c.linkedinLabel+'</a>'+
        '<a href="'+siteData.resume+'" download>r\u00e9sum\u00e9 \u2193</a>'+
      '</div>'+
      '<p class="now"><b>Currently</b><br>'+now+'</p>';
  }

  function renderHome(){
    var c = siteData.contact;
    var fe = siteData.experiences.filter(function(x){return x.featured;}).slice(0,LIMIT);
    var fp = siteData.projects.filter(function(p){return p.featured;}).slice(0,LIMIT);
    var skills = siteData.skills.map(function(s){
      return '<div class="skill-row"><span class="k">'+s.group+'</span><span class="v">'+s.items.join(", ")+'</span></div>';
    }).join("");
    var socials = '<div class="socials">'+
      '<a href="'+c.github+'" target="_blank" rel="noopener" aria-label="GitHub">'+ICON.github+'</a>'+
      '<a href="'+c.linkedin+'" target="_blank" rel="noopener" aria-label="LinkedIn">'+ICON.linkedin+'</a>'+
      '<a href="mailto:'+c.email+'" aria-label="Email">'+ICON.email+'</a></div>';
    el("page-home").innerHTML =
      '<p class="intro">'+siteData.intro+'</p>'+
      '<p class="sect-label">Experience</p>'+ fe.map(expCard).join("") + viewAll("#experience","View all experience") +
      '<p class="sect-label gap">Projects</p>'+ fp.map(function(p){return projCard(p,false);}).join("") + viewAll("#projects","View all projects") +
      '<p class="sect-label gap">Skills</p>'+ skills + socials;
  }

  function renderAbout(){
    var a = siteData.about;
    var bio = '<div class="about-bio">'+a.bio.map(function(p){return "<p>"+p+"</p>";}).join("")+'</div>';
    var edu = a.education.map(function(e){
      return '<div class="edu"><div class="edu-head"><span class="edu-school">'+e.school+'</span><span class="edu-when">'+e.dates+'</span></div>'+
        '<div class="edu-degree">'+e.degree+'</div>'+
        '<div class="edu-meta"><span class="gpa">'+e.gpa+'</span><span>'+e.detail+'</span></div>'+
        (e.courses ? viewAll("#courses","View all courses") : "")+'</div>';
    }).join("");
    el("page-about").innerHTML = '<p class="sect-label">About</p>'+bio+'<p class="sect-label gap">Education</p>'+edu;
  }

  function renderCourses(){
    var terms = siteData.about.terms.map(function(t){
      var rows = t.rows.map(function(r){
        return '<div class="course-row"><span class="code">'+r.code+'</span><span class="ctitle">'+r.title+'</span>'+
          '<span class="grade'+(r.muted?' muted':'')+'">'+r.grade+'</span></div>';
      }).join("");
      var note = t.note ? '<div class="tnote">'+t.note+'</div>' : "";
      return '<div class="term"><div class="term-head"><div class="thead">'+t.term+'</div>'+note+'</div><div class="term-rows">'+rows+'</div></div>';
    }).join("");
    el("page-courses").innerHTML = '<p class="sect-label">Coursework &amp; Grades</p>'+terms;
  }

  function renderExperience(){ el("page-experience").innerHTML = '<p class="sect-label">Experience</p>'+ siteData.experiences.map(expCard).join(""); }
  function renderProjects(){ el("page-projects").innerHTML = '<p class="sect-label">Projects</p>'+ siteData.projects.map(function(p){return projCard(p,true);}).join(""); }

  function show(page){
    if (PAGES.indexOf(page)===-1) page="home";
    PAGES.forEach(function(p){ var n=el("page-"+p); if(n) n.classList.toggle("active", p===page); });
    document.querySelectorAll('.pill button[data-page]').forEach(function(b){ b.classList.toggle("active", b.dataset.page===page); });
    window.scrollTo({top:0, behavior:"auto"});
  }
  function route(){ show((location.hash||"#home").replace("#","")); }

  document.addEventListener("DOMContentLoaded", function(){
    renderRail(); renderHome(); renderAbout(); renderCourses(); renderExperience(); renderProjects();
    document.querySelectorAll('.pill button[data-page]').forEach(function(b){
      b.addEventListener("click", function(){ location.hash = "#"+b.dataset.page; });
    });
    window.addEventListener("hashchange", route);
    var tb=el("themeBtn"), ico=el("themeIco");
    tb.addEventListener("click", function(){ var dark=document.body.classList.toggle("dark"); ico.textContent = dark ? "\u263e" : "\u2600"; });
    route();
  });
})();
</script>
</body>
</html>
