<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhana Karthikeya Ventrapragada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- floating pill page nav -->
  <nav class="pill" aria-label="Pages">
    <button class="active" data-page="home">Home</button>
    <button data-page="about">About</button>
    <button data-page="experience">Experience</button>
    <button data-page="projects">Projects</button>
    <span class="div"></span>
    <button class="theme" id="themeBtn" aria-label="Toggle dark mode"><span id="themeIco">☀</span><span id="themeTxt">Light</span></button>
  </nav>

  <div class="wrap">
    <div class="layout">
      <aside class="rail" id="rail"><!-- rendered by app.js --></aside>
      <main class="content">
        <section class="page active" id="page-home"></section>
        <section class="page" id="page-about"></section>
        <section class="page" id="page-experience"></section>
        <section class="page" id="page-projects"></section>
      </main>
    </div>
  </div>

  <!-- content first, then the renderer -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
